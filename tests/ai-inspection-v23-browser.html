<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v23 AI Canvas 回归</title>
    <style>
        body { margin: 32px; color: #18202a; font: 14px/1.7 system-ui, sans-serif; }
        h1 { font-size: 20px; }
        pre { padding: 16px; border-radius: 8px; background: #f5f7fa; white-space: pre-wrap; }
        .pass { color: #168447; }
        .fail { color: #c73535; }
    </style>
    <script src="../js/ai-inspection/visual-semantic-parser.js"></script>
    <script src="../js/ai-inspection/semantic-matcher.js"></script>
    <script src="../js/ai-inspection/style-evaluator.js"></script>
    <script src="../js/ai-inspection/annotation-policy.js"></script>
    <script src="../js/ai-inspection/local-registration.js"></script>
    <script src="../js/ai-inspection/ai-inspection-engine.js"></script>
</head>
<body>
    <h1>v23 AI Canvas 回归</h1>
    <pre id="result">正在执行……</pre>
    <script>
        'use strict';
        try { Object.defineProperty(window, 'TextDetector', { value: undefined, configurable: true }); } catch (_) {}

        const settings = {
            ignoreContent: true,
            ignoreQuantity: true,
            ignoreSystemUI: false,
            ignoreDynamicImages: true,
            ignoreRenderNoise: true,
            sensitivity: 3
        };

        function canvas(width = 180, height = 360) {
            const element = document.createElement('canvas');
            element.width = width;
            element.height = height;
            const context = element.getContext('2d');
            context.fillStyle = '#fff';
            context.fillRect(0, 0, width, height);
            return element;
        }

        function card(context, y, kind = 2, radius = 0) {
            context.beginPath();
            context.roundRect(15, y, 150, 70, radius);
            context.fillStyle = '#e7eaf0';
            context.fill();
            context.fillStyle = '#222';
            for (let index = 0; index < kind; index += 1) {
                context.fillRect(30, y + 17 + index * 17, 52 + index * 24, 5);
            }
        }

        function field(context, y) {
            context.fillStyle = '#222';
            for (let index = 0; index < 4; index += 1) context.fillRect(28 + index * 7, y, 5, 8);
            context.fillStyle = '#aeb5bf';
            context.fillRect(28, y + 23, 124, 1);
        }

        function button(context, y) {
            context.fillStyle = '#366ff9';
            context.fillRect(24, y, 132, 42);
            context.fillStyle = '#fff';
            for (let index = 0; index < 4; index += 1) context.fillRect(67 + index * 8, y + 16, 5, 8);
        }

        async function analyze(designImage, devImage) {
            return new LocalVisualInspectionEngine().analyze({
                designImage,
                devImage,
                baseWidth: 180,
                settings
            });
        }

        async function run() {
            const rows = [];
            const check = (name, result, predicate, detail) => {
                const passed = predicate(result);
                rows.push(`${passed ? '通过' : '失败'}｜${name}｜${detail(result)}`);
                if (!passed) throw new Error(`${name} 未通过：${JSON.stringify(result.annotations)}`);
            };

            const same = canvas(180, 300);
            card(same.getContext('2d'), 60, 2, 10);
            button(same.getContext('2d'), 190);
            const identical = await analyze(same, same);
            check('相同图片', identical, result => result.annotations.length === 0,
                result => `${result.annotations.length} 条标注`);

            const reorderDesign = canvas(180, 320);
            const reorderDev = canvas(180, 320);
            [1, 2, 3].forEach((kind, index) => card(reorderDesign.getContext('2d'), 20 + index * 95, kind));
            [3, 1, 2].forEach((kind, index) => card(reorderDev.getContext('2d'), 20 + index * 95, kind));
            const reordered = await analyze(reorderDesign, reorderDev);
            check('完整模块换序', reordered, result => result.annotations.length === 0,
                result => `${result.annotations.length} 条位置／样式标注`);

            const formDesign = canvas(180, 320);
            const formDev = canvas(180, 320);
            [45, 95, 145, 195].forEach(y => field(formDesign.getContext('2d'), y));
            [45, 95, 145].forEach(y => field(formDev.getContext('2d'), y));
            const formQuantity = await analyze(formDesign, formDev);
            check('普通表单 4→3', formQuantity, result => result.annotations.length === 0,
                result => `${result.annotations.length} 条标注，忽略 ${result.summary.ignoredTotal} 处`);

            const gapDesign = canvas(180, 320);
            const gapDev = canvas(180, 320);
            for (const target of [gapDesign, gapDev]) {
                const context = target.getContext('2d');
                context.fillStyle = '#f1f3f6';
                context.fillRect(15, 25, 150, 250);
            }
            [58, 106, 154, 202].forEach(y => field(gapDesign.getContext('2d'), y));
            [58, 106, 154].forEach(y => field(gapDev.getContext('2d'), y));
            const bottomGap = await analyze(gapDesign, gapDev);
            check('删减内容后的固定容器留白', bottomGap,
                result => result.annotations.length === 1 && result.annotations[0].evidence?.kind === 'bottom-gap',
                result => result.annotations.map(item => item.description).join('；'));

            const criticalDesign = canvas(180, 320);
            const criticalDev = canvas(180, 320);
            card(criticalDesign.getContext('2d'), 40, 2);
            card(criticalDev.getContext('2d'), 40, 2);
            button(criticalDesign.getContext('2d'), 210);
            const criticalMissing = await analyze(criticalDesign, criticalDev);
            check('关键按钮缺失', criticalMissing,
                result => result.annotations.length === 1 && result.annotations[0].category === 'critical-missing',
                result => result.annotations.map(item => item.description).join('；'));

            const dividerDesign = canvas(180, 220);
            const dividerDev = canvas(180, 220);
            dividerDesign.getContext('2d').fillStyle = '#222';
            dividerDesign.getContext('2d').fillRect(20, 100, 140, 1);
            dividerDev.getContext('2d').fillStyle = '#222';
            dividerDev.getContext('2d').fillRect(20, 100, 140, 3);
            const divider = await analyze(dividerDesign, dividerDev);
            check('分割线粗细', divider,
                result => result.annotations.length === 1 && result.annotations[0].evidence?.kind === 'divider-thickness',
                result => result.annotations.map(item => item.description).join('；'));

            const radiusDesign = canvas(180, 310);
            const radiusDev = canvas(180, 310);
            [20, 115, 210].forEach(y => card(radiusDesign.getContext('2d'), y, 2, 14));
            [20, 115, 210].forEach(y => card(radiusDev.getContext('2d'), y, 2, 3));
            const repeatedRadius = await analyze(radiusDesign, radiusDev);
            check('重复卡片规律性圆角错误', repeatedRadius,
                result => result.annotations.length === 1 && result.annotations[0].evidence?.representativeCount === 3,
                result => result.annotations.map(item => item.description).join('；'));

            const target = document.getElementById('result');
            target.className = 'pass';
            target.textContent = `${rows.join('\n')}\n\n全部 7 组 Canvas 回归通过。`;
            console.log(target.textContent);
        }

        window.__v23RegressionPromise = run().catch(error => {
            const target = document.getElementById('result');
            target.className = 'fail';
            target.textContent = error.stack || error.message;
            console.error(error);
            throw error;
        });
    </script>
</body>
</html>
